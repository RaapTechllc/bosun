[workspace]
resolver = "2"
members = ["crates/bosun-hid", "apps/bosunctl"]
default-members = ["apps/bosunctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RaapTech LLC"]
rust-version = "1.80"

[workspace.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-static-hidraw"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
